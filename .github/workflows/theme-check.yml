name: Theme Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Shopify CLI
        run: |
          gem install theme-check
          theme-check --version

      - name: Run theme-check
        run: theme-check --fail-level error .
