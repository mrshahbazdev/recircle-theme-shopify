# ReCircle — Theme Check configuration
# https://shopify.dev/docs/themes/tools/theme-check

root: "."

ignore:
  - node_modules/
  - .github/
  - "*.md"
  - "SKILL.md"
  - "screenshots/**"

MissingTemplate:
  ignore:
    - "templates/customers/*"

# Allow richer inline styles (we ship a small theme.css footprint)
RemoteAsset:
  enabled: false

TemplateLength:
  max_length: 600

ParserBlockingScript:
  enabled: true

AssetPreload:
  enabled: true

AssetSizeJavaScript:
  threshold_in_bytes: 100000

AssetSizeCSSStylesheet:
  threshold_in_bytes: 150000
